/* ---------------- sfida lampo: 60 secondi ---------------- */
function runFlash(){
  const seen=allSeenItems();
  if(seen.length<8){ toast("Fai almeno una lezione prima"); return }
  const app=$("#app"); let score=0, left=60, tick=null, cur=null;
  const stop=()=>{ clearInterval(tick); tick=null };
  const next=()=>{
    app.innerHTML="";
    const head=el("div","row between"); head.style.margin="14px 0 8px";
    head.appendChild(el("div","sub","Sfida lampo \u00b7 <b style='color:var(--text)'>"+score+"</b> giuste"));
    const q=el("button","badge","Esci"); q.onclick=()=>{ stop(); go("home") }; head.appendChild(q);
    app.appendChild(head);
    const tm=el("div","timer"); tm.innerHTML='<i style="width:'+(left/60*100)+'%"></i>'; app.appendChild(tm);
    if(!tick) tick=setInterval(()=>{
      left--; const bar=$(".timer i"); if(bar) bar.style.width=(left/60*100)+"%";
      const t=$(".timer"); if(t&&left<=10) t.classList.add("low");
      if(left<=0){ stop(); end() }
    },1000);
    cur=seen[Math.random()*seen.length|0];
    const box=el("div","fade"); app.appendChild(box);
    box.appendChild(el("h2","hero-en",esc(cur.it))); box.lastChild.style.cssText="font-size:26px;margin:18px 0 14px";
    shuffle([cur.en].concat(distractors(seen,cur.en,"en",3))).forEach(o=>{
      const b=el("button","choice",esc(o));
      b.onclick=()=>{ const ok=o===cur.en;
        if(ok){ score++; srsGrade(cur.key,true) } else { srsGrade(cur.key,false); b.classList.add("bad") }
        if(left>0) setTimeout(next,ok?60:520); };
      box.appendChild(b);
    });
  };
  const end=()=>{
    const rec=score>(S.best||0); if(rec){ S.best=score; } addXp(score*3); touchStreak(); save();
    app.innerHTML="";
    const c=el("div","card fade center"); c.style.marginTop="26px";
    c.appendChild(el("div","big-num",String(score)));
    c.appendChild(el("p","sub","risposte giuste in 60 secondi"));
    c.appendChild(el("hr","sep"));
    c.appendChild(el("p","sub", rec?"Nuovo record personale.":"Il tuo record \u00e8 "+(S.best||0)+"."));
    c.appendChild(el("p","tip","Qui non conta sapere le parole: conta quanto in fretta ti vengono. \u00c8 la differenza tra capire l'inglese e parlarlo."));
    const a=el("button","btn primary block","Riprova"); a.style.marginTop="12px";
    a.onclick=()=>{ score=0; left=60; next() }; c.appendChild(a);
    const b=el("button","btn ghost block","Torna alla home"); b.style.marginTop="8px";
    b.onclick=()=>go("home"); c.appendChild(b);
    app.appendChild(c);
  };
  next();
}

/* ---------------- dialoghi a bivi ---------------- */
function runDialog(d){
  const app=$("#app"); let i=0, good=0; const hist=[];
  const step=()=>{
    app.innerHTML="";
    const head=el("div","row between"); head.style.margin="14px 0 2px";
    head.appendChild(el("div","sub",esc(d.t)+" \u00b7 "+Math.min(i+1,d.turns.length)+"/"+d.turns.length));
    const q=el("button","badge","Esci"); q.onclick=()=>go("dialogs"); head.appendChild(q);
    app.appendChild(head);
    const bar=el("div","bar"); bar.innerHTML='<i style="width:'+(i/d.turns.length*100)+'%"></i>'; app.appendChild(bar);
    if(i===0) app.appendChild(el("p","tip",esc(d.intro)));
    hist.forEach(h=>{ const b=el("div","bub "+h.k, esc(h.en)+"<small>"+esc(h.it)+"</small>"); app.appendChild(b) });
    if(i>=d.turns.length) return finish();
    const t=d.turns[i];
    const bb=el("div","bub them fade", esc(t.them)+"<small>"+esc(t.it)+"</small>");
    app.appendChild(bb);
    const r=el("div","row"); r.style.margin="4px 0 14px";
    r.appendChild(speakBtn(t.them));
    const slow=el("button","btn ghost","Pi\u00f9 lento"); slow.onclick=()=>TTS.say(t.them,{rate:.6});
    r.appendChild(slow); app.appendChild(r);
    setTimeout(()=>TTS.say(t.them),350);
    app.appendChild(el("p","sub","Come rispondi?"));
    shuffle(t.o.slice()).forEach(([en,ok,why])=>{
      const b=el("button","choice",esc(en));
      b.onclick=()=>{
        lockChoices(app); b.classList.add(ok?"good":"bad");
        if(ok) good++;
        TTS.say(en);
        const fb=el("div","card fade");
        fb.appendChild(el("p","sub","<b style='color:"+(ok?"var(--mint)":"var(--rose)")+"'>"+(ok?"S\u00ec, cos\u00ec funziona":"Meglio evitare")+"</b><br>"+esc(why)));
        if(!ok){ const right=t.o.find(x=>x[1]===1);
          fb.appendChild(el("p","tip","La risposta che funziona: <b>"+esc(right[0])+"</b>")); }
        const nx=el("button","btn primary block", i+1>=d.turns.length?"Vedi il risultato":"Continua");
        nx.style.marginTop="12px";
        nx.onclick=()=>{ const chosen=ok?en:t.o.find(x=>x[1]===1)[0];
          hist.push({k:"them",en:t.them,it:t.it}); hist.push({k:"me",en:chosen,it:""});
          i++; step(); };
        fb.appendChild(nx); app.appendChild(fb); fb.scrollIntoView({block:"nearest"});
      };
      app.appendChild(b);
    });
  };
  const finish=()=>{
    addXp(good*8); touchStreak();
    if(!S.dlg.includes(d.id)){ S.dlg.push(d.id) } save();
    const c=el("div","card fade center");
    c.appendChild(el("div","big-num",good+"/"+d.turns.length));
    c.appendChild(el("p","sub","risposte azzeccate"));
    c.appendChild(el("hr","sep"));
    c.appendChild(el("p","sub", good===d.turns.length
      ? "Tutto giusto. Ora rifai il dialogo dicendo le battute ad alta voce: \u00e8 l\u00ec che si fissa."
      : "Ripetilo: la seconda volta noterai che le risposte buone hanno tutte la stessa forma."));
    const a=el("button","btn primary block","Rifallo"); a.style.marginTop="12px";
    a.onclick=()=>{ i=0; good=0; hist.length=0; step() }; c.appendChild(a);
    const b=el("button","btn ghost block","Altri dialoghi"); b.style.marginTop="8px";
    b.onclick=()=>go("dialogs"); c.appendChild(b);
    $("#app").appendChild(c);
  };
  step();
}

  /* --- falsi amici --- */
  const f=el("div","card");
  f.appendChild(el("h3",null,"Falsi amici"));
  f.appendChild(el("p","sub","Parole che sembrano italiane e non lo sono. Toccale per sentirle."));
  const ft=el("div","gram"); const tb=el("table");
  FALSE_FRIENDS.forEach(([en,it,warn])=>{
    const tr=el("tr"); const td1=el("td"); const bt=el("button","k",esc(en));
    bt.onclick=()=>TTS.say(en); td1.appendChild(bt);
    tr.appendChild(td1); tr.appendChild(el("td","",'<b style="color:var(--mint)">'+esc(it)+'</b><br><span class="ex" style="font-size:12.5px">'+esc(warn)+'</span>'));
    tb.appendChild(tr);
  });
  ft.appendChild(tb); f.appendChild(ft); app.appendChild(f);

  /* --- verbi irregolari --- */
  const v=el("div","card");
  v.appendChild(el("h3",null,"I 30 verbi irregolari che coprono quasi tutto"));
  const vt=el("div","gram"); const vb=el("table");
  IRREG.forEach(([a,b,c])=>{
    const tr=el("tr"); const td=el("td"); const bt=el("button","k",esc(a)+" → "+esc(b));
    bt.onclick=()=>TTS.say(a+", "+b); td.appendChild(bt);
    tr.appendChild(td); tr.appendChild(el("td","",'<span class="ex">'+esc(c)+'</span>'));
    vb.appendChild(tr);
  });
  vt.appendChild(vb); v.appendChild(vt); app.appendChild(v);

  /* --- impostazioni --- */
  const s=el("div","card");
  s.appendChild(el("h3",null,"Impostazioni"));
  const vr=el("div"); vr.style.margin="12px 0";
  vr.appendChild(el("p","sub","Voce inglese"));
  const sel=el("select","tf"); sel.style.marginTop="6px";
  const fill=()=>{
    sel.innerHTML="";
    if(!TTS.voices.length){ sel.appendChild(el("option",null,"Nessuna voce inglese trovata")); return }
    TTS.voices.forEach(x=>{ const o=el("option",null,x.name+" ("+x.lang+")"); o.value=x.name; if(S.voice===x.name)o.selected=true; sel.appendChild(o) });
  };
  fill(); setTimeout(fill,700);
  sel.onchange=()=>{ S.voice=sel.value; save(); TTS.say("This is your new voice. Let's start.") };
  vr.appendChild(sel); s.appendChild(vr);

  const rr=el("div"); rr.style.margin="14px 0";
  rr.appendChild(el("p","sub","Velocità · <b id='rv'>"+S.rate.toFixed(2)+"</b>"));
  const rng=el("input"); rng.type="range"; rng.min=".5"; rng.max="1.1"; rng.step=".05"; rng.value=S.rate; rng.style.width="100%";
  rng.oninput=()=>{ S.rate=+rng.value; $("#rv").textContent=S.rate.toFixed(2); save() };
  rng.onchange=()=>TTS.say("The server is down, but I already fixed it.");
  rr.appendChild(rng); s.appendChild(rr);

  const th=el("button","btn block",S.theme==="dark"?"Passa al tema chiaro":"Passa al tema scuro");
  th.onclick=()=>{ S.theme=S.theme==="dark"?"light":"dark"; save(); document.documentElement.dataset.theme=S.theme; go("me") };
  s.appendChild(th);

  const dt=el("button","btn block",(S.de!==false)?"Nascondi gli agganci col tedesco":"Mostra gli agganci col tedesco");
  dt.style.marginTop="10px";
  dt.onclick=()=>{ S.de=!(S.de!==false); save(); go("me") };
  s.appendChild(dt);

  const lk=el("button","btn block",(S.lock===false)?"Attiva il blocco con codice":"Disattiva il blocco con codice");
  lk.style.marginTop="10px";
  lk.onclick=()=>{ S.lock=(S.lock===false); save(); go("me"); toast(S.lock?"Blocco attivo al prossimo avvio":"Blocco disattivato") };
  s.appendChild(lk);

  const gl=el("div"); gl.style.margin="16px 0 4px";
  gl.appendChild(el("p","sub","Obiettivo giornaliero"));
  const gr=el("div","row wrap"); gr.style.marginTop="8px";
  [[20,"Leggero","~10 min"],[40,"Normale","~20 min"],[80,"Intenso","~40 min"]].forEach(([v,t,d])=>{
    const b=el("button","btn",t+"<br><span style='font-weight:500;font-size:11px;opacity:.7'>"+d+"</span>");
    b.style.flex="1"; if((S.goal||40)===v) b.classList.add("primary");
    b.onclick=()=>{ S.goal=v; save(); go("me") }; gr.appendChild(b);
  });
  gl.appendChild(gr); s.appendChild(gl);

  const sf=el("button","btn block",(S.sfx===false)?"Attiva suoni e vibrazione":"Disattiva suoni e vibrazione");
  sf.style.marginTop="10px";
  sf.onclick=()=>{ S.sfx=(S.sfx===false); save(); if(S.sfx) beep(true); go("me") };
  s.appendChild(sf);

  const cp=el("button","btn block","Cambia codice");
  cp.style.marginTop="10px";
  cp.onclick=()=>{
    const a=prompt("Nuovo codice (almeno 4 cifre):");
    if(a===null) return;
    if(!/^[0-9]{4,12}$/.test(a)){ toast("Servono da 4 a 12 cifre"); return }
    const b=prompt("Ripeti il nuovo codice:");
    if(b!==a){ toast("I due codici non coincidono"); return }
    S.pin=pinHash(a); save(); toast("Codice aggiornato");
  };
  s.appendChild(cp);

  s.appendChild(el("p","sub","Gli agganci col tedesco compaiono solo nelle schede di studio, mai durante gli esercizi."));
  s.lastChild.style.marginTop="8px";
  app.appendChild(s);

  /* --- installazione --- */
  const i=el("div","card");
  i.appendChild(el("h3",null,"Installare sul telefono"));
  i.appendChild(el("div","gram",`<p><b>Android / Chrome:</b> menù ⋮ → <span class="k">Aggiungi a schermata Home</span>.</p>
  <p><b>iPhone / Safari:</b> tasto Condividi → <span class="k">Aggiungi alla schermata Home</span>.</p>
  <p>Dopo l'installazione si apre a schermo intero, come un'app, e funziona anche senza rete. Il microfono per gli esercizi di pronuncia funziona meglio su Chrome Android.</p>`));
  app.appendChild(i);

  /* --- reset --- */
  const r=el("div","card");
  r.appendChild(el("h3",null,"Ricominciare da capo"));
  r.appendChild(el("p","sub","Cancella lezioni completate, ripassi e punti. Non si può annullare."));
  const rb=el("button","btn block","Azzera i progressi"); rb.style.marginTop="12px"; rb.style.color="var(--rose)";
  rb.onclick=()=>{ if(confirm("Azzerare tutti i progressi?")){ S=Object.assign({},DEF); save(); document.documentElement.dataset.theme=S.theme; paintTop(); go("home") } };
  r.appendChild(rb); app.appendChild(r);

  if(!store.ok){
    const w=el("div","card");
    w.appendChild(el("p","sub","<b style='color:var(--signal)'>Nota</b><br>Qui l'archiviazione del browser è bloccata, quindi i progressi durano solo per questa sessione. Scarica il file e aprilo dal telefono: lì i progressi restano salvati."));
    app.appendChild(w);
  }
};

/* ============================ AVVIO ============================ */
function makeIcon(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const x=c.getContext("2d");
  x.fillStyle="#131B33"; x.fillRect(0,0,size,size);
  const u=size/512, bars=[.28,.52,.78,1,.66,.4,.86,.55,.3];
  x.fillStyle="#FFB13C";
  bars.forEach((h,i)=>{
    const w=26*u, gap=44*u, tot=bars.length*gap-(gap-w);
    const bx=(size-tot)/2+i*gap, bh=200*u*h;
    x.beginPath();
    if(x.roundRect) x.roundRect(bx,size/2-bh/2,w,bh,w/2); else x.rect(bx,size/2-bh/2,w,bh);
    x.fill();
  });
  return c.toDataURL("image/png");
}
function setupPWA(){
  try{
    const i512=makeIcon(512), i192=makeIcon(192);
    const mf={name:"Speak First — inglese da zero",short_name:"Speak First",start_url:".",scope:".",
      display:"standalone",orientation:"portrait",background_color:"#131B33",theme_color:"#131B33",lang:"it",
      icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  }catch(e){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}
/* ---------------- blocco con PIN ----------------
   Non è una vera protezione: il codice sta in questo file, che è pubblico.
   Serve solo a impedire l'apertura casuale da parte di chi ha in mano il telefono.
   Il PIN si cambia dall'app: Io -> Cambia PIN. */
const PIN_DEFAULT="hsvxxv"; /* impronta di 2026 */
function pinHash(t){let h=2166136261>>>0;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
function pinOk(t){ return pinHash(t)===(S.pin||PIN_DEFAULT) }

function boot(){ paintTop(); paintNav(); go("home"); }

function lockScreen(){
  const L=el("div"); L.id="lock";
  L.innerHTML='<div class="lbrand">Speak<span> First</span></div><p class="lsub">Inserisci il codice</p>';
  const dots=el("div","pins"); L.appendChild(dots);
  const err=el("p","lerr",""); L.appendChild(err);
  const pad=el("div","keypad"); L.appendChild(pad);
  let buf="";
  const draw=()=>{ dots.innerHTML=""; for(let i=0;i<Math.max(4,buf.length);i++){ const d=el("i"); if(i<buf.length)d.className="f"; dots.appendChild(d) } };
  draw();
  const tap=v=>{
    err.textContent="";
    if(v==="del"){ buf=buf.slice(0,-1); draw(); return }
    if(buf.length>=12) return;
    buf+=v; draw();
    if(buf.length>=4 && pinOk(buf)){
      L.remove(); document.body.style.overflow="";
      $("#top").classList.remove("hidden"); $("#nav").classList.remove("hidden");
      boot();
    }
  };
  ["1","2","3","4","5","6","7","8","9"].forEach(n=>{ const b=el("button",null,n); b.onclick=()=>tap(n); pad.appendChild(b) });
  const empty=el("button","alt",""); empty.disabled=true; pad.appendChild(empty);
  const zero=el("button",null,"0"); zero.onclick=()=>tap("0"); pad.appendChild(zero);
  const del=el("button","alt","canc"); del.onclick=()=>tap("del"); pad.appendChild(del);
  const check=el("button","btn ghost","Verifica"); check.style.marginTop="18px";
  check.onclick=()=>{ if(pinOk(buf)){ tap("") } else { err.textContent="Codice errato"; L.classList.add("shake"); setTimeout(()=>L.classList.remove("shake"),400); buf=""; draw() } };
  L.appendChild(check);
  $("#top").classList.add("hidden"); $("#nav").classList.add("hidden");
  document.body.style.overflow="hidden";
  document.body.appendChild(L);
}

document.documentElement.dataset.theme=S.theme||"dark";
TTS.init(); setupPWA();
if(S.lock===false) boot(); else lockScreen();
document.addEventListener("visibilitychange",()=>{ if(document.hidden) try{speechSynthesis.cancel()}catch(e){} });
</script>
