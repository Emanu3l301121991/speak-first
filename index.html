<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Speak First — inglese da zero</title>
<meta name="description" content="Corso di inglese parlato e scritto da zero, per italiani.">
<meta name="theme-color" content="#131B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak First">
<link id="manifest" rel="manifest" href="manifest.json">
<link id="appleicon" rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#131B33; --surface:#1B2645; --surface2:#243155; --line:#35426E;
  --text:#EAEEF9; --dim:#94A1C7;
  --signal:#FFB13C; --mint:#54DDA3; --rose:#FF7E90; --violet:#A98BFF;
  --shadow:0 10px 30px rgba(5,10,25,.45);
  --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="light"]{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface2:#F3F5FB; --line:#D5DCEC;
  --text:#16203A; --dim:#5C6B92;
  --signal:#C97B00; --mint:#0E9E68; --rose:#D6435A; --violet:#6E4BD8;
  --shadow:0 8px 24px rgba(30,45,90,.10);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
#top{
  position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:linear-gradient(var(--bg) 72%,transparent);
  display:flex;align-items:center;gap:12px;
}
#top .brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
#top .brand span{color:var(--signal)}
#top .spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim)
}
.pill b{color:var(--text)}
main{padding:0 16px calc(96px + var(--safe-b));max-width:640px;margin:0 auto}

/* ---------- bottom nav ---------- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
#nav button{padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:11px;font-weight:600}
#nav button .ic{width:24px;height:24px;display:block}
#nav button[aria-current="true"]{color:var(--text)}
#nav button[aria-current="true"] .ic{color:var(--signal)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13.5px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* ---------- hero: la frase inglese domina ---------- */
.hero-en{
  font-size:clamp(26px,7.6vw,38px);font-weight:800;line-height:1.15;
  letter-spacing:-.03em;margin:0 0 8px;
}
.hero-it{color:var(--dim);font-size:15px;margin:0}
.hero-de{color:var(--violet);font-size:13px;margin:8px 0 0;font-weight:600}

/* ---------- waveform (elemento firma) ---------- */
.wave{display:flex;align-items:center;gap:3px;height:34px}
.wave i{width:3px;height:6px;border-radius:2px;background:var(--line);display:block;transition:height .09s ease,background .2s}
.wave.on i{background:var(--signal)}
.wave.mic.on i{background:var(--mint)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);min-height:50px
}
.btn.primary{background:var(--signal);color:#20160A;border-color:transparent}
html[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn.mint{background:var(--mint);color:#06281A;border-color:transparent}
html[data-theme="light"] .btn.mint{color:#fff}
.iconbtn{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.iconbtn.big{width:64px;height:64px}
.iconbtn.live{background:var(--signal);border-color:transparent;color:#20160A}
.iconbtn.rec{background:var(--mint);border-color:transparent;color:#06281A}

/* ---------- choices ---------- */
.choice{
  display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--line);margin:9px 0;font-size:16px;font-weight:600;min-height:52px
}
.choice.good{background:color-mix(in srgb,var(--mint) 22%,var(--surface2));border-color:var(--mint)}
.choice.bad{background:color-mix(in srgb,var(--rose) 20%,var(--surface2));border-color:var(--rose)}
.choice small{display:block;font-weight:500;color:var(--dim);font-size:12.5px;margin-top:2px}

/* ---------- input ---------- */
.tf{
  width:100%;padding:15px 16px;border-radius:14px;background:var(--surface2);
  border:1px solid var(--line);font-size:17px;font-weight:600
}
.tf::placeholder{color:var(--dim);font-weight:500}

/* ---------- tiles (ricostruzione frase) ---------- */
.slot{min-height:64px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:var(--surface2)}
.tile{padding:9px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}

/* ---------- progress ---------- */
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--signal);border-radius:99px;transition:width .4s ease}
.bar.m i{background:var(--mint)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--signal)}

/* ---------- lista lezioni ---------- */
.unit{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin:8px 0;width:100%;text-align:left}
.unit .n{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto;border:1px solid var(--line)}
.unit.done .n{background:var(--mint);color:#06281A;border-color:transparent}
.unit.next{border-color:var(--signal)}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-size:15px;letter-spacing:-.01em}
.unit .t span{display:block;color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit.locked{opacity:.55}

.phase-h{display:flex;align-items:baseline;gap:9px;margin:22px 0 6px}
.phase-h b{font-size:13px;color:var(--signal);font-weight:800}
.phase-h span{font-size:13px;color:var(--dim)}

/* ---------- misc ---------- */
.k{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:700;font-size:14px;display:inline-block}
.gram{font-size:14.5px;line-height:1.62}
.gram p{margin:0 0 9px}
.gram b{color:var(--signal)}
.gram .ex{color:var(--dim)}
.gram table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}
.gram td{padding:6px 8px;border-bottom:1px solid var(--line)}
.gram td:first-child{font-weight:700;white-space:nowrap}
.tip{border-left:3px solid var(--violet);padding-left:12px;margin:10px 0;font-size:14px;color:var(--dim)}
.tip b{color:var(--violet)}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--dim)}
.badge.mint{color:var(--mint);border-color:var(--mint)}
.badge.rose{color:var(--rose);border-color:var(--rose)}
.center{text-align:center}
.hidden{display:none!important}
.big-num{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat{flex:1;text-align:center;padding:12px 4px;background:var(--surface2);border-radius:14px;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--dim);font-weight:600}
.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
a{color:var(--signal)}
/* percorso a nodi */
.path{display:flex;flex-direction:column;align-items:center;padding:6px 0 24px}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;margin:9px 0}
.nbtn{width:68px;height:68px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--text);box-shadow:0 4px 0 var(--line)}
.nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.node.done .nbtn{background:var(--mint);color:#06281A;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.node.full .nbtn{background:var(--violet);color:#160C33;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.node.next .nbtn{background:var(--signal);color:#20160A;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.node.locked{opacity:.48}
.node .ttl{font-size:11.5px;color:var(--dim);text-align:center;max-width:130px;line-height:1.25}
.crowns{display:flex;gap:4px;height:10px;align-items:center}
.crowns i{width:8px;height:8px;background:var(--line);transform:rotate(45deg);border-radius:2px;display:block}
.crowns i.on{background:var(--signal)}
.spine{width:3px;height:16px;background:var(--line);border-radius:3px;margin:-4px 0}
/* anello obiettivo */
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .mid span{font-size:10.5px;color:var(--dim);font-weight:600}
.combo{font-size:12.5px;font-weight:800;color:var(--signal)}
.bub{max-width:88%;padding:12px 15px;border-radius:17px;margin:9px 0;font-size:15.5px;line-height:1.45}
.bub.them{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{background:var(--signal);color:#20160A;margin-left:auto;border-bottom-right-radius:5px;font-weight:600}
html[data-theme="light"] .bub.me{color:#fff}
.bub small{display:block;font-size:12.5px;opacity:.72;margin-top:5px;font-weight:400}
.timer{height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--signal);transition:width 1s linear}
.timer.low i{background:var(--rose)}
.dcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:9px 0;width:100%;text-align:left}
.dcard .t{flex:1;min-width:0}
.dcard .t b{display:block;font-size:15px;letter-spacing:-.01em}
.dcard .t span{display:block;color:var(--dim);font-size:12.5px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px 22px calc(28px + var(--safe-b))}
#lock .lbrand{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
#lock .lbrand span{color:var(--signal)}
#lock .lsub{color:var(--dim);font-size:14px;margin:0 0 26px}
#lock .pins{display:flex;gap:12px;height:16px;align-items:center;margin-bottom:6px}
#lock .pins i{width:13px;height:13px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);display:block}
#lock .pins i.f{background:var(--signal);border-color:var(--signal)}
#lock .lerr{color:var(--rose);font-size:13.5px;font-weight:600;height:20px;margin:8px 0 0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:290px;margin-top:20px}
.keypad button{height:62px;border-radius:17px;background:var(--surface);border:1px solid var(--line);
  font-size:23px;font-weight:700;color:var(--text)}
.keypad button:active{background:var(--surface2)}
.keypad button.alt{font-size:16px;font-weight:600;color:var(--dim)}
.shake{animation:shk .38s}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(7px)}50%{transform:translateX(-7px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:var(--surface2);border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow)}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Speak<span> First</span></div>
  <div class="spacer"></div>
  <div class="pill" id="streakPill">🔥 <b>0</b></div>
  <div class="pill" id="xpPill"><b>0</b> xp</div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
/* =======================================================================
   CORSO — 36 unità, 3 fasi.  w = parole [en, it, aggancio tedesco/nota]
                              p = frasi  [en, it]
   ======================================================================= */
const PHASES=[
 {n:1,t:"Sopravvivenza",d:"Farti capire in qualsiasi situazione"},
 {n:2,t:"Conversazione",d:"Passato, futuro, discorso che scorre"},
 {n:3,t:"Inglese al lavoro",d:"Email, riunioni, ticket, colloquio"},
 {n:4,t:"Inglese che scorre",d:"Passivo, sfumature, presentazioni, colloquio avanzato"}
];

const UNITS=[
/* ---------------- FASE 1 ---------------- */
{id:1,ph:1,t:"Io sono, tu sei",s:"il verbo essere",
w:[["I","io","ich"],["you","tu / voi","du / ihr"],["he","lui","er"],["she","lei","sie"],["we","noi","wir"],["they","loro","sie (plurale)"],["name","nome","Name — identico"],["my","mio / mia","mein"]],
p:[["I am Emanuele.","Sono Emanuele."],["You are my friend.","Tu sei mio amico."],["He is at work.","Lui è al lavoro."],["She is Italian.","Lei è italiana."],["We are here.","Noi siamo qui."],["They are ready.","Loro sono pronti."]],
gr:`<p>Il verbo <b>to be</b> (essere) ha solo tre forme:</p>
<table><tr><td>I</td><td><span class="k">am</span> — I am / I'm</td></tr>
<tr><td>he, she, it</td><td><span class="k">is</span> — he is / he's</td></tr>
<tr><td>you, we, they</td><td><span class="k">are</span> — you are / you're</td></tr></table>
<p>In inglese il pronome <b>non si può mai togliere</b>. In italiano dici "sono stanco", in inglese devi dire <span class="k">I am tired</span>.</p>
<div class="tip"><b>Ponte col tedesco:</b> è la stessa logica di ich <i>bin</i> / du <i>bist</i> / wir <i>sind</i>. Solo che l'inglese ne ha tre invece di sei. È più facile del tedesco.</div>`},

{id:2,ph:1,t:"Io ho",s:"to have + a / an / the",
w:[["have","avere","haben"],["has","ha (lui/lei)","hat"],["a","un / uno","ein"],["the","il / la / i / le","der, die, das → uno solo!"],["water","acqua","Wasser"],["house","casa","Haus"],["car","macchina","—"],["time","tempo","Zeit"]],
p:[["I have a dog.","Ho un cane."],["She has a car.","Lei ha una macchina."],["I have a question.","Ho una domanda."],["We don't have time.","Non abbiamo tempo."],["The water is cold.","L'acqua è fredda."],["It's an apple.","È una mela."]],
gr:`<p><b>a</b> davanti a consonante, <b>an</b> davanti a vocale: <span class="ex">a car / an email</span>.</p>
<p><b>the</b> copre tutti i nostri articoli determinativi. Non cambia mai: the man, the woman, the cars.</p>
<p>Attenzione: <span class="k">he / she / it → has</span>, tutti gli altri <span class="k">have</span>.</p>
<div class="tip"><b>Ponte col tedesco:</b> have = haben, has = hat. Stessa famiglia, stesso suono.</div>`},

{id:3,ph:1,t:"Quello che faccio ogni giorno",s:"presente semplice",
w:[["work","lavorare / lavoro","Werk"],["live","vivere, abitare","leben"],["speak","parlare","sprechen"],["want","volere","—"],["need","avere bisogno","nötig"],["like","piacere","—"],["know","sapere, conoscere","kennen"],["go","andare","gehen"]],
p:[["I work in IT.","Lavoro nell'IT."],["I live in Speyer.","Abito a Speyer."],["I speak Italian and German.","Parlo italiano e tedesco."],["I want to learn English.","Voglio imparare l'inglese."],["She works from home.","Lei lavora da casa."],["He speaks very fast.","Lui parla molto veloce."]],
gr:`<p>Il presente inglese è il verbo nudo. Nessuna coniugazione... tranne una cosa:</p>
<p><b>alla terza persona singolare si aggiunge -s</b>: I work → <span class="k">he works</span>, I live → <span class="k">she lives</span>.</p>
<p>Regola pratica: <b>he / she / it = +s</b>. Tutto il resto niente.</p>
<div class="tip"><b>Errore tipico italiano:</b> dimenticare quella -s. Chi ascolta lo nota subito. Esagera per due settimane e poi ti verrà naturale.</div>`},

{id:4,ph:1,t:"Dire di no",s:"la negazione",
w:[["not","non","nicht"],["don't","non (io/tu/noi/loro)","—"],["doesn't","non (lui/lei)","—"],["never","mai","nie"],["nothing","niente","nichts"],["but","ma","aber"],["also","anche","auch"],["very","molto","—"]],
p:[["I don't understand.","Non capisco."],["I don't speak English well yet.","Non parlo ancora bene inglese."],["She doesn't know.","Lei non lo sa."],["It's not a problem.","Non è un problema."],["I never work on Sunday.","Non lavoro mai di domenica."],["He doesn't have time.","Lui non ha tempo."]],
gr:`<p>Per negare un verbo normale serve l'aiutante <b>do</b>:</p>
<table><tr><td>I / you / we / they</td><td><span class="k">don't</span> + verbo</td></tr>
<tr><td>he / she / it</td><td><span class="k">doesn't</span> + verbo</td></tr></table>
<p>Attenzione: dopo <b>doesn't</b> la -s sparisce. <span class="ex">She works → she doesn't work</span> (mai "doesn't works").</p>
<p>Con <b>to be</b> invece niente do: <span class="k">I'm not</span>, <span class="k">it isn't</span>.</p>`},

{id:5,ph:1,t:"Fare domande",s:"le sei parole chiave",
w:[["what","che cosa","was"],["where","dove","wo"],["when","quando","wann"],["who","chi","wer"],["why","perché (domanda)","warum"],["how","come","wie"],["which","quale","welche"],["how much","quanto","wie viel"]],
p:[["What is this?","Che cos'è questo?"],["Where are you from?","Di dove sei?"],["When does it start?","Quando comincia?"],["Why not?","Perché no?"],["How much is it?","Quanto costa?"],["How do you say this in English?","Come si dice questo in inglese?"]],
gr:`<p>Domanda con <b>to be</b>: si gira. <span class="ex">You are ready → <span class="k">Are you ready?</span></span></p>
<p>Domanda con gli altri verbi: si mette <b>do / does</b> davanti. <span class="ex">You work here → <span class="k">Do you work here?</span></span></p>
<p>Con la parola interrogativa: <b>Where do you live?</b> — parola-domanda + do + soggetto + verbo. Sempre quest'ordine.</p>
<div class="tip"><b>Ponte col tedesco:</b> what/was, where/wo, when/wann, who/wer, why/warum, how/wie. Sono le stesse parole invecchiate diversamente.</div>`},

{id:6,ph:1,t:"Numeri, ore, giorni",s:"dire quando",
w:[["number","numero","Nummer"],["hour","ora (60 min)","Uhr"],["day","giorno","Tag"],["week","settimana","Woche"],["month","mese","Monat"],["year","anno","Jahr"],["today","oggi","heute"],["tomorrow","domani","morgen"]],
p:[["It's ten o'clock.","Sono le dieci."],["I work eight hours a day.","Lavoro otto ore al giorno."],["See you tomorrow.","Ci vediamo domani."],["How long does it take?","Quanto ci vuole?"],["It takes twenty minutes.","Ci vogliono venti minuti."],["Every Monday at nine.","Ogni lunedì alle nove."]],
gr:`<p>1 one · 2 two · 3 three · 4 four · 5 five · 6 six · 7 seven · 8 eight · 9 nine · 10 ten<br>
11 eleven · 12 twelve · 13 thirteen · 20 twenty · 30 thirty · 100 a hundred · 1000 a thousand</p>
<p>Le ore: <b>at</b> + ora → <span class="ex">at seven, at half past seven (7:30)</span>.</p>
<p>I giorni: <b>on</b> Monday. I mesi: <b>in</b> May. L'anno: <b>in</b> 2026.</p>
<div class="tip">Regola meccanica: <b>at</b> per l'orario, <b>on</b> per il giorno, <b>in</b> per mese e anno. Dal più piccolo al più grande.</div>`},

{id:7,ph:1,t:"Questo, quello, questi",s:"plurali e dimostrativi",
w:[["this","questo","dies"],["that","quello","das"],["these","questi","diese"],["those","quelli","—"],["thing","cosa","Ding"],["people","persone, gente","—"],["man / men","uomo / uomini","Mann / Männer"],["woman / women","donna / donne","Frau"]],
p:[["This is my desk.","Questa è la mia scrivania."],["That is not correct.","Quello non è corretto."],["These are my keys.","Queste sono le mie chiavi."],["Those people are waiting.","Quelle persone stanno aspettando."],["How many people are coming?","Quante persone vengono?"],["What's that?","Cos'è quello?"]],
gr:`<p>Vicino → <b>this</b> (uno) / <b>these</b> (più di uno). Lontano → <b>that</b> / <b>those</b>.</p>
<p>Il plurale è quasi sempre <b>-s</b>: car → cars. Ma: <span class="ex">man→men, woman→women, child→children, person→people, foot→feet</span>.</p>
<p><b>people</b> è già plurale: <span class="k">people are</span>, mai "people is".</p>`},

{id:8,ph:1,t:"C'è, ci sono",s:"there is / there are",
w:[["there is","c'è","es gibt"],["there are","ci sono","es gibt"],["some","un po' di, alcuni","—"],["any","(in domande/negazioni)","—"],["problem","problema","Problem"],["room","stanza, spazio","Raum"],["door","porta","Tür"],["someone","qualcuno","jemand"]],
p:[["There is a problem.","C'è un problema."],["There are two rooms.","Ci sono due stanze."],["Is there any coffee?","C'è del caffè?"],["There isn't much time.","Non c'è molto tempo."],["How many are there?","Quanti ce ne sono?"],["There's someone at the door.","C'è qualcuno alla porta."]],
gr:`<p>Uno → <b>there is</b> (there's). Più di uno → <b>there are</b>.</p>
<p><b>some</b> nelle frasi affermative, <b>any</b> nelle domande e nelle negazioni:</p>
<p class="ex">I have some questions. / Do you have any questions? / I don't have any questions.</p>
<div class="tip">Non tradurre "ci" letteralmente. "Ci sono io" non è "there am I", è <b>I'm here</b>.</div>`},

{id:9,ph:1,t:"Chiedere aiuto",s:"can / can't",
w:[["can","potere, sapere fare","können"],["can't","non potere","kann nicht"],["help","aiutare / aiuto","helfen"],["understand","capire","verstehen"],["hear","sentire","hören"],["come","venire","kommen"],["again","di nuovo","—"],["slowly","lentamente","langsam"]],
p:[["Can you help me?","Puoi aiutarmi?"],["I can't hear you.","Non ti sento."],["Can you repeat that, please?","Puoi ripetere, per favore?"],["Can you say that again, more slowly?","Puoi ridirlo più lentamente?"],["I can come tomorrow.","Posso venire domani."],["She can speak four languages.","Lei sa parlare quattro lingue."]],
gr:`<p><b>can</b> non cambia mai: I can, he can, we can. E dopo can il verbo è nudo, senza <i>to</i>: <span class="k">I can go</span>.</p>
<p>Domanda: si gira. <span class="k">Can you...?</span> Negazione: <span class="k">can't</span>.</p>
<div class="tip"><b>Le tre frasi che ti salvano la vita in ogni conversazione</b>, imparale a memoria oggi: <br>Sorry, I didn't catch that. · Could you repeat that, please? · Could you speak a bit more slowly?</div>`},

{id:10,ph:1,t:"Di chi è",s:"possessivi e genitivo",
w:[["your","tuo, vostro","dein"],["his","suo (di lui)","sein"],["her","suo (di lei)","ihr"],["our","nostro","unser"],["their","loro","ihr"],["friend","amico","Freund"],["family","famiglia","Familie"],["colleague","collega","Kollege"]],
p:[["This is my car.","Questa è la mia macchina."],["What's your name?","Come ti chiami?"],["Her name is Anna.","Lei si chiama Anna."],["It's Marco's laptop.","È il portatile di Marco."],["Our office is closed.","Il nostro ufficio è chiuso."],["Their team is small.","Il loro team è piccolo."]],
gr:`<p>In inglese il possesso si mette <b>prima</b>, e non concorda con l'oggetto ma con il proprietario:</p>
<p class="ex">la macchina di lei = <b>her</b> car · la macchina di lui = <b>his</b> car</p>
<p>"di" con le persone si fa con <b>'s</b>: <span class="ex">il capo di Anna = <b>Anna's</b> boss</span>. Al contrario dell'italiano: prima il proprietario, poi la cosa.</p>
<div class="tip"><b>Errore tipico:</b> dire "the car of my friend". Si dice <b>my friend's car</b>.</div>`},

{id:11,ph:1,t:"Sto facendo",s:"present continuous",
w:[["now","adesso","nun"],["right now","proprio ora","—"],["waiting","aspettando","warten"],["looking for","cercando","—"],["learning","imparando","lernen"],["still","ancora","—"],["busy","occupato","—"],["almost","quasi","—"]],
p:[["I'm learning English.","Sto imparando l'inglese."],["What are you doing?","Che stai facendo?"],["I'm working right now.","Sto lavorando proprio ora."],["She's not coming today.","Lei oggi non viene."],["We're waiting for you.","Ti stiamo aspettando."],["I'm still looking for it.","Lo sto ancora cercando."]],
gr:`<p>Azione in corso adesso = <b>am / is / are + verbo-ing</b>.</p>
<p class="ex">I work here (in generale) ≠ I'm working now (in questo momento)</p>
<p>Serve anche per il futuro già deciso: <span class="k">I'm flying to Rome on Friday.</span></p>
<div class="tip"><b>Vantaggio per te:</b> in tedesco questa forma non esiste, in italiano sì ("sto facendo"). Quindi qui parti avvantaggiato: è la stessa identica logica dell'italiano.</div>`},

{id:12,ph:1,t:"Dove e come",s:"in / on / at e le altre",
w:[["in","in, dentro","in"],["on","su, sopra","auf"],["at","a, presso","an"],["to","a, verso","zu"],["from","da","von"],["with","con","mit"],["for","per","für"],["about","riguardo a","über"]],
p:[["I'm at home.","Sono a casa."],["The keys are on the table.","Le chiavi sono sul tavolo."],["I live in Germany.","Vivo in Germania."],["I'm going to Munich.","Vado a Monaco."],["I work with two colleagues.","Lavoro con due colleghi."],["It's about the new project.","Riguarda il nuovo progetto."]],
gr:`<table><tr><td>in</td><td>dentro qualcosa: in the box, in Italy, in the room</td></tr>
<tr><td>on</td><td>su una superficie: on the table, on the wall</td></tr>
<tr><td>at</td><td>un punto preciso: at home, at work, at the station</td></tr></table>
<p>Le preposizioni non si traducono mai una a una: si imparano attaccate al loro sostantivo. Memorizza <b>at home</b>, <b>at work</b>, <b>on the train</b> come se fossero parole singole.</p>`},

/* ---------------- FASE 2 ---------------- */
{id:13,ph:2,t:"Ieri ero",s:"was / were",
w:[["was","ero, era","war"],["were","eri, eravamo, erano","waren"],["yesterday","ieri","gestern"],["last","scorso","letzte"],["ago","fa (tempo)","—"],["before","prima","bevor"],["then","allora, poi","dann"],["easy","facile","—"]],
p:[["I was at home.","Ero a casa."],["It was great.","È stato fantastico."],["They were late.","Erano in ritardo."],["Where were you yesterday?","Dov'eri ieri?"],["It wasn't easy.","Non è stato facile."],["I was there two years ago.","Ero lì due anni fa."]],
gr:`<p>Passato di <b>to be</b>: solo due forme.</p>
<table><tr><td>I, he, she, it</td><td><span class="k">was</span></td></tr><tr><td>you, we, they</td><td><span class="k">were</span></td></tr></table>
<p>Negazione: wasn't / weren't. Domanda: <span class="k">Were you...?</span></p>
<p><b>ago</b> va sempre dopo: <span class="ex">three days ago</span> = tre giorni fa.</p>`},

{id:14,ph:2,t:"Ieri ho fatto",s:"passato regolare -ed",
w:[["worked","ho lavorato","—"],["finished","ho finito","—"],["called","ho chiamato","—"],["asked","ho chiesto","—"],["started","ho iniziato","—"],["needed","avevo bisogno","—"],["happened","è successo","—"],["decided","ho deciso","—"]],
p:[["I finished the report.","Ho finito il report."],["She called me yesterday.","Mi ha chiamato ieri."],["We started at nine.","Abbiamo iniziato alle nove."],["I worked there for two years.","Ho lavorato lì per due anni."],["They asked a lot of questions.","Hanno fatto molte domande."],["It happened last week.","È successo la settimana scorsa."]],
gr:`<p>Passato regolare = verbo + <b>-ed</b>. E vale per <b>tutte</b> le persone, senza eccezioni.</p>
<p class="ex">work → worked · call → called · start → started</p>
<p>Un solo passato copre due tempi italiani: <i>ho finito</i> e <i>finii</i> sono entrambi <b>I finished</b>.</p>
<div class="tip">Pronuncia di -ed: quasi sempre è solo una <b>t</b> o una <b>d</b> attaccata, non "-ed". <span class="ex">worked → "wörkt", called → "cold"</span>. Solo dopo t/d si sente "id": wanted → "uontid".</div>`},

{id:15,ph:2,t:"I verbi ribelli",s:"i 8 irregolari più usati",
w:[["went","sono andato (go)","ging"],["had","ho avuto (have)","hatte"],["said","ho detto (say)","sagte"],["made","ho fatto (make)","machte"],["took","ho preso (take)","—"],["got","ho ricevuto (get)","—"],["saw","ho visto (see)","sah"],["came","sono venuto (come)","kam"]],
p:[["I went to Berlin.","Sono andato a Berlino."],["He said no.","Ha detto di no."],["I took the train.","Ho preso il treno."],["We had a meeting.","Abbiamo avuto una riunione."],["I got your email.","Ho ricevuto la tua email."],["She came late.","È arrivata tardi."]],
gr:`<p>Circa 100 verbi non seguono -ed. Ma i primi 20 coprono la stragrande maggioranza del parlato reale. Li trovi tutti nella scheda <b>Verbi irregolari</b> nella sezione Io.</p>
<p>Impara la coppia <b>presente → passato</b> come una parola sola: go-went, take-took, come-came.</p>
<div class="tip"><b>Ponte col tedesco:</b> l'inglese ha verbi forti come il tedesco, e spesso sono gli stessi: come-came / kommen-kam, see-saw / sehen-sah, give-gave / geben-gab.</div>`},

{id:16,ph:2,t:"Hai fatto?",s:"domande al passato",
w:[["did","hai / ho (aiutante)","—"],["didn't","non ho / non hai","—"],["really","davvero","—"],["maybe","forse","—"],["sure","sicuro, certo","—"],["anything","qualcosa","—"],["everything","tutto","—"],["something","qualcosa","—"]],
p:[["Did you see my message?","Hai visto il mio messaggio?"],["Where did you go?","Dove sei andato?"],["I didn't understand.","Non ho capito."],["What did he say?","Cosa ha detto?"],["Did it work?","Ha funzionato?"],["How long did it take?","Quanto ci è voluto?"]],
gr:`<p>Nelle domande e nelle negazioni al passato usi <b>did</b>, e il verbo principale <b>torna al presente</b>:</p>
<p class="ex">You went → <b>Did you go?</b> / I <b>didn't go</b>. (mai "did you went")</p>
<p>Il passato è già dentro <i>did</i>: non va segnato due volte. È l'errore numero uno degli italiani.</p>`},

{id:17,ph:2,t:"Domani farò",s:"will e going to",
w:[["will","forma del futuro","will (≠ volere!)"],["won't","non (futuro)","—"],["going to","sto per, ho intenzione","—"],["next","prossimo","nächste"],["soon","presto","—"],["later","più tardi","später"],["ready","pronto","—"],["until","fino a","bis"]],
p:[["I'll call you later.","Ti chiamo dopo."],["It's going to rain.","Sta per piovere."],["I won't be there.","Non ci sarò."],["We'll see.","Vedremo."],["I'm going to start on Monday.","Comincerò lunedì."],["When will it be ready?","Quando sarà pronto?"]],
gr:`<p><b>will</b> = decisione presa adesso, promessa, previsione. <span class="ex">I'll help you.</span></p>
<p><b>going to</b> = piano già deciso prima. <span class="ex">I'm going to buy a new laptop.</span></p>
<p>Dopo will il verbo è sempre nudo: <span class="k">will be</span>, <span class="k">will go</span>.</p>
<div class="tip"><b>Falso amico col tedesco:</b> l'inglese <i>will</i> NON significa "volere" come il tedesco <i>ich will</i>. Volere in inglese è <b>want</b>.</div>`},

{id:18,ph:2,t:"Devo, dovrei, vorrei",s:"i modali",
w:[["must","devo (necessità forte)","muss"],["have to","devo (obbligo esterno)","—"],["should","dovrei (consiglio)","sollte"],["could","potrei","könnte"],["would","-ei (condizionale)","würde"],["may","posso (permesso)","—"],["might","potrebbe darsi","—"],["let","lasciare, permettere","lassen"]],
p:[["I have to go.","Devo andare."],["You should try.","Dovresti provare."],["Could you help me?","Potresti aiutarmi?"],["I would like a coffee.","Vorrei un caffè."],["We must fix this today.","Dobbiamo sistemarlo oggi."],["You don't have to come.","Non sei obbligato a venire."]],
gr:`<p>Il condizionale italiano (-ei) in inglese si fa con <b>would</b> + verbo:</p>
<p class="ex">vorrei = <b>I would like</b> (I'd like) · farei = <b>I would do</b> · potresti = <b>could you</b></p>
<p>Dopo un modale il verbo è sempre nudo e senza -s: <span class="k">she should go</span>.</p>
<div class="tip"><b>Da usare ogni giorno:</b> "I would like" è la forma educata di "I want". In ufficio e al ristorante usa sempre <b>I'd like</b>.</div>`},

{id:19,ph:2,t:"Meglio, peggio, il migliore",s:"comparativi",
w:[["better","migliore, meglio","besser"],["worse","peggiore","—"],["more","più","mehr"],["less","meno","—"],["than","di, che (paragone)","als"],["best","il migliore","beste"],["difficult","difficile","—"],["cheap","economico","—"]],
p:[["This is better.","Questo è meglio."],["It's more difficult than I thought.","È più difficile di quanto pensassi."],["That's the best solution.","È la soluzione migliore."],["It's cheaper than the other one.","È più economico dell'altro."],["As soon as possible.","Il prima possibile."],["It's the same for me.","Per me è uguale."]],
gr:`<p>Parole corte → <b>-er / -est</b>: cheap → cheaper → the cheapest.</p>
<p>Parole lunghe → <b>more / the most</b>: difficult → more difficult → the most difficult.</p>
<p>Irregolari da sapere a memoria: good→<b>better</b>→<b>best</b>, bad→<b>worse</b>→<b>worst</b>.</p>
<p>"di" nel paragone è sempre <b>than</b>: <span class="ex">better than</span>.</p>`},

{id:20,ph:2,t:"Quanto, quanti, troppo",s:"le quantità",
w:[["much","molto (non contabile)","—"],["many","molti (contabile)","—"],["a lot of","tanto, tanti","—"],["few","pochi","—"],["enough","abbastanza","genug"],["too","troppo","zu"],["only","solo","—"],["most","la maggior parte","meiste"]],
p:[["I don't have much time.","Non ho molto tempo."],["There are too many emails.","Ci sono troppe email."],["That's enough.","Basta così."],["Only a few people came.","Sono venute solo poche persone."],["How much does it cost?","Quanto costa?"],["Most of the work is done.","La maggior parte del lavoro è fatta."]],
gr:`<p>Se lo puoi <b>contare</b> → many / few. Se non lo puoi contare → much / little.</p>
<p class="ex">many emails, many people · much time, much water</p>
<p><b>a lot of</b> va bene per entrambi ed è quello che gli inglesi usano davvero nel parlato.</p>
<p>Attenzione: <b>too</b> = troppo (negativo), <b>very</b> = molto. <span class="ex">too difficult</span> ≠ <span class="ex">very difficult</span>.</p>`},

{id:21,ph:2,t:"L'ho già fatto",s:"present perfect",
w:[["ever","mai (in domanda)","—"],["never","mai","nie"],["just","appena","—"],["yet","già / ancora","—"],["since","da (un momento)","seit"],["for","per (una durata)","—"],["already","già","schon"],["been","stato","gewesen"]],
p:[["I've never been to London.","Non sono mai stato a Londra."],["Have you finished yet?","Hai già finito?"],["I've just sent it.","L'ho appena inviato."],["I've worked here since 2025.","Lavoro qui dal 2025."],["She hasn't answered yet.","Non ha ancora risposto."],["Have you ever tried it?","L'hai mai provato?"]],
gr:`<p><b>have / has + participio</b>. Si usa quando il momento preciso non conta o l'azione tocca ancora l'adesso.</p>
<p class="ex">I saw him yesterday (momento preciso → passato semplice)<br>I've seen him (quando non importa → present perfect)</p>
<p><b>since</b> + punto di partenza (since Monday, since 2025). <b>for</b> + durata (for two years).</p>
<div class="tip"><b>Attenzione, trappola italiana:</b> "lavoro qui da tre anni" NON è "I work here since three years". È <b>I've worked here for three years</b>.</div>`},

{id:22,ph:2,t:"Legare le frasi",s:"i connettori",
w:[["because","perché (risposta)","—"],["so","quindi, allora","also"],["although","anche se","obwohl"],["however","tuttavia","—"],["that's why","ecco perché","—"],["for example","per esempio","—"],["anyway","comunque","—"],["actually","in realtà (≠ attualmente!)","—"]],
p:[["I'm late because of the traffic.","Sono in ritardo per il traffico."],["It's difficult, but possible.","È difficile, ma possibile."],["So, what do you think?","Allora, che ne pensi?"],["However, there's a problem.","Tuttavia c'è un problema."],["That's why I called you.","Ecco perché ti ho chiamato."],["Actually, I disagree.","In realtà non sono d'accordo."]],
gr:`<p><b>because</b> + frase intera · <b>because of</b> + solo sostantivo.</p>
<p class="ex">because it was late · because of the delay</p>
<p>I connettori sono quello che fa suonare "adulto" il tuo inglese anche con poco vocabolario. Usarne tre o quattro bene vale più di 200 parole nuove.</p>
<div class="tip"><b>Falso amico:</b> <b>actually</b> significa "in realtà", non "attualmente". Attualmente = <b>currently</b>.</div>`},

{id:23,ph:2,t:"I verbi con la coda",s:"phrasal verbs essenziali",
w:[["find out","scoprire","herausfinden"],["set up","configurare, allestire","—"],["give up","arrendersi","aufgeben"],["look for","cercare","—"],["turn on / off","accendere / spegnere","—"],["come back","tornare","—"],["figure out","capire, risolvere","—"],["deal with","occuparsi di","—"]],
p:[["I'll find out.","Lo scopro io."],["Can you set it up?","Puoi configurarlo?"],["Don't give up.","Non mollare."],["I'm looking for a new job.","Sto cercando un nuovo lavoro."],["Turn it off and on again.","Spegnilo e riaccendilo."],["I'll deal with it tomorrow.","Me ne occupo domani."]],
gr:`<p>Verbo + preposizione = significato nuovo. <span class="ex">look = guardare, ma <b>look for</b> = cercare</span>.</p>
<p>Con un pronome, la particella va dopo: <span class="k">turn it off</span> (mai "turn off it").</p>
<div class="tip"><b>Ponte col tedesco:</b> sono i tuoi verbi separabili. <i>aufgeben → give up</i>, <i>herausfinden → find out</i>, <i>anmachen → turn on</i>. Stessa identica meccanica.</div>`},

{id:24,ph:2,t:"Se succede",s:"il periodo ipotetico",
w:[["if","se","wenn"],["unless","a meno che","—"],["otherwise","altrimenti","—"],["in case","nel caso","falls"],["as soon as","appena","sobald"],["whether","se (oppure no)","ob"],["instead","invece","—"],["still","ancora, comunque","—"]],
p:[["If it doesn't work, call me.","Se non funziona, chiamami."],["I would do it differently.","Lo farei diversamente."],["Let me know if you need help.","Fammi sapere se serve aiuto."],["As soon as I know, I'll tell you.","Appena lo so, te lo dico."],["Otherwise we lose time.","Altrimenti perdiamo tempo."],["Wait until I'm back.","Aspetta finché torno."]],
gr:`<p>Regola d'oro: <b>dopo if non si mette mai will</b>.</p>
<p class="ex">If it <b>rains</b>, I <b>will</b> stay home. (mai "if it will rain")</p>
<p>Vale anche per when, as soon as, until: la parte del "se/quando" resta al presente.</p>
<p>Ipotesi irreale: <b>if + passato → would</b>. <span class="ex">If I had more time, I would learn faster.</span></p>`},

/* ---------------- FASE 3 ---------------- */
{id:25,ph:3,t:"Scrivere una email",s:"aperture e chiusure che funzionano",
w:[["attached","allegato","—"],["regards","cordiali saluti","—"],["reply","rispondere","—"],["deadline","scadenza","—"],["update","aggiornamento","—"],["forward","inoltrare","—"],["request","richiesta","—"],["by (Friday)","entro (venerdì)","bis"]],
p:[["Hi Tom, thanks for your email.","Ciao Tom, grazie della tua email."],["Please find the file attached.","In allegato trovi il file."],["Let me know if you have any questions.","Fammi sapere se hai domande."],["I'll get back to you tomorrow.","Ti risponderò domani."],["Thanks in advance.","Grazie in anticipo."],["Best regards, Emanuele","Cordiali saluti, Emanuele"]],
gr:`<p><b>Scheletro di ogni email di lavoro</b> — copialo e cambiaci dentro le parole:</p>
<table><tr><td>Apertura</td><td>Hi [nome], / Dear [nome],</td></tr>
<tr><td>Motivo</td><td>I'm writing about... / Quick update on...</td></tr>
<tr><td>Richiesta</td><td>Could you please... / Would it be possible to...</td></tr>
<tr><td>Chiusura</td><td>Let me know if you have any questions.</td></tr>
<tr><td>Saluto</td><td>Best regards, / Kind regards,</td></tr></table>
<div class="tip">L'email inglese è <b>più corta e più diretta</b> di quella italiana e tedesca. Niente "Spett.le", niente giri di parole. Vai al punto nella prima riga.</div>`},

{id:26,ph:3,t:"Il daily standup",s:"dire cosa hai fatto in 30 secondi",
w:[["blocker","ostacolo, blocco","—"],["progress","avanzamento","—"],["task","attività","—"],["done","fatto, finito","—"],["in progress","in corso","—"],["review","revisione","—"],["estimate","stima","—"],["by end of day","entro fine giornata","—"]],
p:[["Yesterday I finished the migration.","Ieri ho finito la migrazione."],["Today I'm working on the API.","Oggi lavoro sull'API."],["I have no blockers.","Non ho blocchi."],["I'm blocked by the firewall rules.","Sono bloccato dalle regole del firewall."],["It's ready for review.","È pronto per la revisione."],["I need one more day for this.","Mi serve un altro giorno per questo."]],
gr:`<p>Lo standup è sempre lo stesso schema. Imparalo come una formula e non dovrai più improvvisare:</p>
<table><tr><td>1</td><td>Yesterday I <b>+ passato</b>...</td></tr>
<tr><td>2</td><td>Today I'm <b>+ -ing</b>...</td></tr>
<tr><td>3</td><td>I have no blockers. / I'm blocked by...</td></tr></table>
<div class="tip">Se ti manca una parola tecnica, dilla in inglese così com'è: firewall, container, deployment, backup sono già inglesi. Non fermarti mai a cercare la traduzione.</div>`},

{id:27,ph:3,t:"Quando qualcosa si rompe",s:"ticket e incidenti",
w:[["issue","problema, ticket","—"],["fix","sistemare / correzione","—"],["deploy","rilasciare","—"],["down","fuori servizio","—"],["log","registro","—"],["restart","riavviare","—"],["root cause","causa principale","—"],["workaround","soluzione temporanea","—"]],
p:[["The server is down.","Il server è giù."],["We have an issue in production.","Abbiamo un problema in produzione."],["I've restarted the service.","Ho riavviato il servizio."],["Can you check the logs?","Puoi controllare i log?"],["It's fixed now.","Ora è sistemato."],["I'll escalate it to the vendor.","Lo escalo al fornitore."]],
gr:`<p><b>Struttura di un aggiornamento su un incidente</b> (usala anche scritta nel ticket):</p>
<p class="ex">1. What happened: <b>The mail service stopped at 14:20.</b><br>
2. Impact: <b>Users can't send emails.</b><br>
3. Status: <b>We're working on it. / It's fixed.</b><br>
4. Next: <b>I'll send an update in one hour.</b></p>
<div class="tip">Quattro righe, quattro tempi verbali che già conosci. Non serve altro per essere professionale in inglese.</div>`},

{id:28,ph:3,t:"Parlare in riunione",s:"prendere la parola senza panico",
w:[["agenda","ordine del giorno","—"],["decision","decisione","—"],["follow up","dare seguito","—"],["agree","essere d'accordo","—"],["clarify","chiarire","—"],["point","punto, osservazione","—"],["move on","andare avanti","—"],["make sense","avere senso","—"]],
p:[["Sorry, can I add something?","Scusate, posso aggiungere una cosa?"],["I agree with you.","Sono d'accordo con te."],["I see it a bit differently.","La vedo un po' diversamente."],["Could you clarify that?","Puoi chiarire quel punto?"],["Let's follow up by email.","Ci sentiamo via email."],["Does that make sense?","Ha senso? / Mi sono spiegato?"]],
gr:`<p>Tre frasi che ti comprano tempo mentre pensi — usale senza vergogna, le usano tutti i madrelingua:</p>
<p class="ex"><b>That's a good question.</b><br><b>Let me think for a second.</b><br><b>Just to make sure I understand — you mean...?</b></p>
<div class="tip">In inglese professionale il disaccordo è morbido: non "you are wrong" ma <b>I see it differently</b> o <b>I'm not sure about that</b>. La durezza tedesca in inglese suona aggressiva.</div>`},

{id:29,ph:3,t:"Spiegare come funziona",s:"descrivere un sistema",
w:[["workflow","flusso di lavoro","—"],["trigger","far partire / evento","—"],["container","container","—"],["database","banca dati","—"],["endpoint","endpoint","—"],["script","script","—"],["run","girare, eseguire","—"],["self-hosted","ospitato in proprio","—"]],
p:[["The workflow runs every night.","Il flusso gira ogni notte."],["It triggers a script on the server.","Fa partire uno script sul server."],["The data goes into the database.","I dati finiscono nel database."],["We run it in a Docker container.","Lo eseguiamo in un container Docker."],["It calls the API endpoint.","Chiama l'endpoint dell'API."],["Everything is self-hosted.","È tutto ospitato da noi."]],
gr:`<p>Per descrivere un sistema in inglese usi <b>solo il presente semplice</b>. Niente tempi complicati:</p>
<p class="ex">The user <b>uploads</b> a file → n8n <b>picks</b> it up → the script <b>converts</b> it → the result <b>goes</b> to the CRM.</p>
<p>Verbi che ti servono davvero: <b>run, call, send, receive, store, check, trigger, return, handle</b>.</p>
<div class="tip">Questa è la tua arma: sai già spiegare architetture in tedesco. Ti mancano 20 verbi, non la lingua intera.</div>`},

{id:30,ph:3,t:"Sopravvivere al telefono",s:"quando non vedi la faccia",
w:[["speaking","parla (al telefono)","—"],["hold on","attendere","—"],["line","linea","Leitung"],["break up","cadere la linea","—"],["catch","afferrare, capire","—"],["put through","passare (una chiamata)","—"],["call back","richiamare","zurückrufen"],["in writing","per iscritto","—"]],
p:[["Hello, this is Emanuele speaking.","Pronto, sono Emanuele."],["Sorry, could you repeat that?","Scusa, puoi ripetere?"],["I didn't catch that.","Non ho afferrato."],["The line is breaking up.","La linea sta cadendo."],["Can you hold on a second?","Puoi attendere un secondo?"],["I'll send it to you in writing.","Te lo mando per iscritto."]],
gr:`<p>Il telefono è la parte più difficile per tutti, anche per chi parla bene. Non è colpa tua: manca il labiale.</p>
<p><b>Kit di emergenza</b>, da avere sempre a portata:</p>
<p class="ex">Sorry, the line is bad — could you say that again?<br>
Let me repeat that back to you, just to be sure.<br>
Could you send me an email with the details?</p>
<div class="tip">L'ultima frase è legittima e professionale: sposta la conversazione dove sei più forte, lo scritto.</div>`},

{id:31,ph:3,t:"Colloquio: parlare di te",s:"i tuoi due minuti",
w:[["experience","esperienza","Erfahrung"],["background","formazione, percorso","—"],["role","ruolo","Rolle"],["responsible for","responsabile di","—"],["skills","competenze","—"],["current","attuale","aktuell"],["challenge","sfida","—"],["environment","ambiente","—"]],
p:[["I'm an IT consultant.","Sono consulente IT."],["I have five years of experience in automation.","Ho cinque anni di esperienza nell'automazione."],["I'm responsible for our clients' infrastructure.","Sono responsabile dell'infrastruttura dei nostri clienti."],["I work mainly with Docker, n8n and Linux.","Lavoro soprattutto con Docker, n8n e Linux."],["I'm looking for a new challenge.","Sto cercando una nuova sfida."],["I speak Italian, German and English.","Parlo italiano, tedesco e inglese."]],
gr:`<p><b>"Tell me about yourself"</b> è sempre la prima domanda. Prepara 60 secondi in tre blocchi:</p>
<table><tr><td>Ora</td><td>I'm an IT consultant at a company near Heidelberg.</td></tr>
<tr><td>Prima</td><td>Before that, I worked in IT support and technical service.</td></tr>
<tr><td>Perché qui</td><td>I'm looking for a role where I can work more on automation.</td></tr></table>
<div class="tip">Scrivi la tua versione, falla correggere, poi <b>ripetila ad alta voce 30 volte</b> finché non ti serve più pensarci. Un pitch imparato bene compensa moltissimo inglese imperfetto.</div>`},

{id:32,ph:3,t:"Colloquio: raccontare un caso",s:"il metodo STAR",
w:[["situation","situazione","—"],["task","compito","—"],["action","azione","—"],["result","risultato","Resultat"],["solve","risolvere","—"],["improve","migliorare","—"],["save","far risparmiare","sparen"],["manual","manuale (a mano)","—"]],
p:[["We had a problem with manual data entry.","Avevamo un problema di inserimento dati manuale."],["My task was to automate the process.","Il mio compito era automatizzare il processo."],["I built a workflow with n8n.","Ho costruito un flusso con n8n."],["It saved about ten hours a week.","Ha fatto risparmiare circa dieci ore a settimana."],["The client was very happy.","Il cliente era molto soddisfatto."],["I learned a lot from that project.","Ho imparato molto da quel progetto."]],
gr:`<p>Per ogni domanda del tipo "raccontami una volta in cui...", rispondi in quattro frasi:</p>
<table><tr><td>S</td><td>We had a problem with...</td></tr>
<tr><td>T</td><td>My task was to...</td></tr>
<tr><td>A</td><td>I built / I set up / I automated...</td></tr>
<tr><td>R</td><td>It saved / It reduced / The result was...</td></tr></table>
<div class="tip">Prepara <b>tre</b> storie STAR dai tuoi progetti reali. Coprono il 90% delle domande comportamentali, in qualunque colloquio.</div>`},

{id:33,ph:3,t:"Colloquio: le tue domande",s:"e il discorso soldi",
w:[["salary","stipendio","Gehalt"],["expectation","aspettativa","—"],["notice period","preavviso","Kündigungsfrist"],["remote","da remoto","—"],["next steps","prossimi passi","—"],["offer","offerta","Angebot"],["range","fascia","—"],["negotiable","trattabile","—"]],
p:[["Could you tell me more about the team?","Puoi dirmi di più sul team?"],["What would a typical day look like?","Com'è una giornata tipo?"],["My notice period is three months.","Il mio preavviso è di tre mesi."],["My salary expectation is in the range of...","La mia aspettativa salariale è intorno a..."],["Is remote work possible?","È possibile lavorare da remoto?"],["What are the next steps?","Quali sono i prossimi passi?"]],
gr:`<p>Sul denaro l'inglese usa formule fisse. Impara queste e non improvvisare:</p>
<p class="ex">I'm looking for something <b>in the range of</b> X.<br>
That's <b>negotiable</b>, depending on the whole package.<br>
Could you tell me the <b>budget</b> for this role?</p>
<div class="tip">Fare domande alla fine non è opzionale: in un colloquio anglosassone chi non fa domande sembra non interessato. Preparane tre e scrivile su un foglio davanti a te.</div>`},

{id:34,ph:3,t:"Scrivere documentazione",s:"istruzioni chiare",
w:[["overview","panoramica","Übersicht"],["requirement","requisito","—"],["step","passo","Schritt"],["note","nota","Notiz"],["warning","avvertenza","Warnung"],["default","predefinito","—"],["make sure","assicurarsi","—"],["following","seguente","folgende"]],
p:[["This document describes the setup.","Questo documento descrive la configurazione."],["Follow these steps.","Segui questi passi."],["Make sure the service is running.","Assicurati che il servizio sia attivo."],["By default, the port is 8080.","Di default la porta è 8080."],["Note: this requires admin rights.","Nota: servono i diritti di amministratore."],["If it fails, check the log file.","Se fallisce, controlla il file di log."]],
gr:`<p>Le istruzioni in inglese si scrivono all'<b>imperativo nudo</b>: verbo all'inizio, senza soggetto.</p>
<p class="ex"><b>Open</b> the file. <b>Run</b> the script. <b>Check</b> the output. <b>Do not</b> restart the server.</p>
<p>Una frase = un'azione. Frasi corte. Niente subordinate.</p>
<div class="tip">La documentazione è il posto migliore per allenare lo scritto: è la forma d'inglese più semplice che esista, e la fai già in tedesco.</div>`},

{id:35,ph:3,t:"Le chiacchiere",s:"small talk professionale",
w:[["weekend","fine settimana","Wochenende"],["holiday","vacanza, festivo","—"],["weather","tempo (meteo)","Wetter"],["busy","impegnato","—"],["sounds good","mi sembra ottimo","—"],["take care","stammi bene","—"],["catch up","aggiornarsi","—"],["by the way","a proposito","—"]],
p:[["How's it going?","Come va?"],["How was your weekend?","Com'è andato il fine settimana?"],["Sounds good.","Mi sembra ottimo."],["It's been a busy week.","È stata una settimana intensa."],["Nice to meet you.","Piacere di conoscerti."],["Have a nice weekend!","Buon fine settimana!"]],
gr:`<p>Lo small talk è un rituale, non una conversazione vera. Le risposte sono quasi fisse:</p>
<table><tr><td>How are you?</td><td>Good, thanks — and you?</td></tr>
<tr><td>How's it going?</td><td>Not bad. Busy week!</td></tr>
<tr><td>How was your weekend?</td><td>Pretty good, thanks. We went to...</td></tr></table>
<div class="tip">Non serve essere brillante. Serve <b>rispondere e rilanciare</b>: due parole tue, poi "and you?". È tutto quello che ci si aspetta.</div>`},

{id:36,ph:3,t:"Dire di no con eleganza",s:"negoziare e dare brutte notizie",
w:[["unfortunately","purtroppo","leider"],["I'm afraid","temo che","—"],["instead","invece","stattdessen"],["priority","priorità","—"],["realistic","realistico","—"],["propose","proporre","—"],["agree on","accordarsi su","—"],["delay","ritardo","—"]],
p:[["Unfortunately that's not possible.","Purtroppo non è possibile."],["I'm afraid we can't do that by Friday.","Temo che non ce la faremo per venerdì."],["Can we agree on next Wednesday?","Possiamo accordarci per mercoledì prossimo?"],["What's the priority here?","Qual è la priorità qui?"],["I'd propose a different approach.","Proporrei un approccio diverso."],["Let's find a solution together.","Troviamo una soluzione insieme."]],
gr:`<p>Il no in inglese professionale ha tre pezzi. Mai solo il primo:</p>
<p class="ex">1. Ammortizza: <b>I'm afraid / Unfortunately</b><br>
2. Il no e il perché: <b>we can't do that by Friday, the tests take two days</b><br>
3. L'alternativa: <b>but we could deliver it on Tuesday</b></p>
<div class="tip">Chiudere sempre con un'alternativa è ciò che distingue un no professionale da un no che crea problemi. E ti fa parlare più a lungo su terreno sicuro.</div>`}
,

/* ---------------- FASE 4 ---------------- */
{id:37,ph:4,t:"È stato fatto",s:"la forma passiva",
w:[["was fixed","è stato sistemato",""],["has been deployed","è stato rilasciato",""],["will be done","sarà fatto",""],["by","da (chi l'ha fatto)","von"],["approved","approvato","genehmigt"],["released","rilasciato",""],["scheduled","programmato",""],["required","richiesto, necessario",""]],
p:[["The server was restarted this morning.","Il server è stato riavviato stamattina."],["The ticket has been closed.","Il ticket è stato chiuso."],["It will be deployed on Friday.","Sarà rilasciato venerdì."],["This was approved by the client.","Questo è stato approvato dal cliente."],["The meeting has been moved to Tuesday.","La riunione è stata spostata a martedì."],["A restart is required.","È necessario un riavvio."]],
gr:`<p>Passivo = <b>to be + participio passato</b>. Si usa quando conta la cosa, non chi l'ha fatta.</p>
<p class="ex">Someone restarted the server → <b>The server was restarted.</b></p>
<p>Chi lo ha fatto, se serve, va in fondo con <b>by</b>: <span class="ex">approved by the client</span>.</p>
<div class="tip"><b>Perché ti serve subito:</b> ticket, documentazione e report sono scritti quasi tutti al passivo. Impararlo qui vale più di dieci parole nuove.</div>`},

{id:38,ph:4,t:"Ha detto che",s:"riferire le parole altrui",
w:[["said","ha detto",""],["told me","mi ha detto",""],["asked","ha chiesto",""],["mentioned","ha accennato",""],["according to","secondo",""],["apparently","a quanto pare",""],["confirm","confermare",""],["hear back","ricevere risposta",""]],
p:[["He said it was urgent.","Ha detto che era urgente."],["She told me she would call back.","Mi ha detto che avrebbe richiamato."],["They asked if we could help.","Hanno chiesto se potevamo aiutare."],["According to the client, it's still broken.","Secondo il cliente è ancora rotto."],["I'll let you know as soon as I hear back.","Ti faccio sapere appena ricevo risposta."],["Can you confirm that in writing?","Puoi confermarlo per iscritto?"]],
gr:`<p>Dopo <b>said</b> e <b>told</b> il verbo fa un passo indietro nel tempo:</p>
<table><tr><td>"It is urgent"</td><td>He said it <b>was</b> urgent</td></tr>
<tr><td>"I will call"</td><td>She said she <b>would</b> call</td></tr>
<tr><td>"We finished"</td><td>They said they <b>had</b> finished</td></tr></table>
<p><b>tell</b> vuole sempre la persona (tell <b>me</b>), <b>say</b> no.</p>`},

{id:39,ph:4,t:"Voglio fare, mi piace fare",s:"verbo + to o -ing",
w:[["want to","volere",""],["need to","avere bisogno di",""],["decide to","decidere di",""],["enjoy","piacere fare",""],["avoid","evitare",""],["keep","continuare a",""],["manage to","riuscire a",""],["look forward to","non vedere l'ora di",""]],
p:[["I want to improve my English.","Voglio migliorare il mio inglese."],["We decided to change the approach.","Abbiamo deciso di cambiare approccio."],["I enjoy working on automation.","Mi piace lavorare sull'automazione."],["Try to avoid restarting in production.","Cerca di evitare riavvii in produzione."],["I managed to fix it.","Sono riuscito a sistemarlo."],["I look forward to hearing from you.","Resto in attesa di sue notizie."]],
gr:`<p>Due gruppi, da imparare a blocchi:</p>
<table><tr><td>+ to</td><td>want, need, decide, try, hope, manage, promise, learn</td></tr>
<tr><td>+ -ing</td><td>enjoy, avoid, keep, finish, mind, suggest, practise</td></tr></table>
<div class="tip"><b>Trappola:</b> <b>look forward to</b> vuole <b>-ing</b>, non l'infinito: <span class="ex">look forward to hear<b>ing</b> from you</span>. È la chiusura di email più usata in assoluto, e quasi tutti gli italiani la sbagliano.</div>`},

{id:40,ph:4,t:"Sì, no, anch'io",s:"risposte brevi naturali",
w:[["Yes, I do.","Sì (verbi normali)",""],["No, I haven't.","No (con have)",""],["So do I.","Anch'io",""],["Neither do I.","Nemmeno io",""],["right?","vero?",""],["I think so.","Credo di sì",""],["I hope not.","Spero di no",""],["Not really.","Non proprio",""]],
p:[["Do you speak English? — Yes, I do.","Parli inglese? — Sì."],["Have you finished? — No, not yet.","Hai finito? — No, non ancora."],["It's ready, right?","È pronto, vero?"],["I don't like meetings. — Neither do I.","Non mi piacciono le riunioni. — Nemmeno a me."],["Is it urgent? — Not really.","È urgente? — Non proprio."],["Will it work? — I think so.","Funzionerà? — Credo di sì."]],
gr:`<p>Rispondere solo <i>Yes</i> o <i>No</i> suona brusco. Si ripete l'ausiliare della domanda:</p>
<table><tr><td>Do you...?</td><td>Yes, I <b>do</b>. / No, I <b>don't</b>.</td></tr>
<tr><td>Are you...?</td><td>Yes, I <b>am</b>. / No, I'm <b>not</b>.</td></tr>
<tr><td>Have you...?</td><td>Yes, I <b>have</b>. / No, I <b>haven't</b>.</td></tr>
<tr><td>Can you...?</td><td>Yes, I <b>can</b>. / No, I <b>can't</b>.</td></tr></table>
<p>Per concordare: <b>So do I</b> (positivo), <b>Neither do I</b> (negativo).</p>`},

{id:41,ph:4,t:"Circa, almeno, fino a",s:"numeri e approssimazione",
w:[["about","circa",""],["roughly","all'incirca",""],["at least","almeno","mindestens"],["up to","fino a",""],["around","intorno a",""],["twice","due volte",""],["per","a, per (per week)","pro"],["half","metà","halb"]],
p:[["It takes about twenty minutes.","Ci vogliono circa venti minuti."],["We have roughly two hundred users.","Abbiamo all'incirca duecento utenti."],["At least three people are affected.","Almeno tre persone sono coinvolte."],["Up to ten gigabytes per day.","Fino a dieci gigabyte al giorno."],["We meet twice a week.","Ci vediamo due volte a settimana."],["Half of the tickets are duplicates.","Metà dei ticket sono doppioni."]],
gr:`<p>Numeri grandi: <span class="ex">1.500 = one thousand five hundred · 2026 = twenty twenty-six</span></p>
<p>Percentuali: <span class="ex">30% = thirty percent</span> · Date: <span class="ex">on the third of March</span></p>
<p>Frequenza: <b>once / twice / three times</b> a week.</p>
<div class="tip">Attenzione al punto e alla virgola: in inglese <b>1,500</b> è millecinquecento e <b>1.5</b> è uno virgola cinque. Al contrario di italiano e tedesco.</div>`},

{id:42,ph:4,t:"Probabilmente, dipende",s:"non impegnarsi troppo",
w:[["likely","probabile",""],["unlikely","improbabile",""],["it depends","dipende",""],["I'd say","direi",""],["so far","finora",""],["worst case","nel caso peggiore",""],["rough estimate","stima approssimativa",""],["I'm not sure","non sono sicuro",""]],
p:[["It's likely to take two days.","Probabilmente ci vorranno due giorni."],["That's unlikely.","È improbabile."],["It depends on the client.","Dipende dal cliente."],["I'd say two or three days.","Direi due o tre giorni."],["So far everything works.","Finora funziona tutto."],["Worst case, we roll back.","Nel caso peggiore torniamo indietro."]],
gr:`<p>In ambito professionale non si promette mai in modo secco. Si smorza:</p>
<p class="ex">It will take two days → <b>It should take about two days.</b><br>
That's wrong → <b>I'm not sure that's right.</b><br>
No → <b>I don't think that's realistic.</b></p>
<div class="tip">Questo è il registro che distingue un inglese da ufficio da uno da manuale. Con le stesse parole di base, cambia solo il modo di attutire.</div>`},

{id:43,ph:4,t:"Presentare davanti a qualcuno",s:"struttura e passaggi",
w:[["slide","diapositiva",""],["overview","panoramica","Übersicht"],["as you can see","come vedete",""],["move on","passare oltre",""],["in short","in breve",""],["to sum up","per riassumere",""],["highlight","evidenziare",""],["walk you through","guidarvi passo passo",""]],
p:[["Today I'll show you how the system works.","Oggi vi mostro come funziona il sistema."],["Let me walk you through the process.","Vi guido attraverso il processo."],["As you can see on this slide...","Come vedete in questa slide..."],["Let's move on to the next point.","Passiamo al punto successivo."],["To sum up, we saved ten hours a week.","Per riassumere, abbiamo risparmiato dieci ore a settimana."],["Thanks for your attention. Any questions?","Grazie dell'attenzione. Domande?"]],
gr:`<p>Regola classica delle presentazioni in inglese, in tre tempi:</p>
<table><tr><td>1</td><td>Dico cosa dirò — <i>Today I'll cover three things.</i></td></tr>
<tr><td>2</td><td>Lo dico — <i>First... Second... Finally...</i></td></tr>
<tr><td>3</td><td>Dico cosa ho detto — <i>To sum up...</i></td></tr></table>
<div class="tip">Le frasi di passaggio (<i>let's move on, as you can see, finally</i>) sono quelle che tengono in piedi la presentazione. Impara quelle sei e puoi presentare qualsiasi cosa.</div>`},

{id:44,ph:4,t:"Scrivere in chat di lavoro",s:"Slack, Teams, registro breve",
w:[["heads up","avviso, preavviso",""],["FYI","per informazione",""],["ASAP","al più presto",""],["on it","ci sto lavorando",""],["ping","scrivere a",""],["no rush","senza fretta",""],["EOD","fine giornata",""],["shipped","rilasciato, mandato",""]],
p:[["Quick question: is the server up?","Domanda veloce: il server è attivo?"],["Heads up — deployment at 6pm.","Avviso: rilascio alle 18."],["On it.","Ci sto lavorando."],["FYI, the client called this morning.","Per informazione, il cliente ha chiamato stamattina."],["Can you ping me when it's done?","Mi scrivi quando è fatto?"],["No rush, whenever you have time.","Senza fretta, quando puoi."]],
gr:`<p>In chat il registro è corto e diretto. Niente "Dear", niente formule lunghe.</p>
<p class="ex">I would like to kindly ask you whether... → <b>Quick question:</b></p>
<p>Sigle che vedrai ogni giorno: <b>FYI</b> (per info), <b>ASAP</b> (al più presto), <b>EOD</b> (fine giornata), <b>PTO</b> (ferie), <b>LGTM</b> (per me va bene).</p>
<div class="tip">Qui puoi permetterti frasi incomplete. "On it." e "Will do." sono risposte perfette e complete in chat.</div>`},

{id:45,ph:4,t:"Spiegare a chi non è tecnico",s:"cliente, capo, utente",
w:[["basically","in pratica",""],["in other words","in altre parole",""],["think of it as","pensalo come",""],["the point is","il punto è",""],["impact","impatto",""],["downtime","interruzione del servizio",""],["safe","al sicuro",""],["make sure","assicurarsi",""]],
p:[["Basically, the system stopped talking to the database.","In pratica il sistema ha smesso di comunicare con il database."],["Think of it as a bridge that broke.","Pensalo come un ponte che si è rotto."],["The point is, no data was lost.","Il punto è che non si è perso nessun dato."],["There will be about ten minutes of downtime.","Ci saranno circa dieci minuti di interruzione."],["Your data is safe.","I vostri dati sono al sicuro."],["I'll make sure it doesn't happen again.","Farò in modo che non succeda più."]],
gr:`<p>Con chi non è tecnico si parla di <b>effetti</b>, non di cause. Tre passaggi:</p>
<p class="ex">1. Cosa vede lui: <b>You couldn't send emails for two hours.</b><br>
2. Perché, in una riga: <b>The mail server ran out of space.</b><br>
3. Cosa hai fatto: <b>It's fixed, and we added an alert.</b></p>
<div class="tip">Questa è anche la struttura giusta per il colloquio: non descrivere la tecnologia, descrivi il problema risolto.</div>`},

{id:46,ph:4,t:"Riunioni difficili",s:"interrompere, rimandare, dire di no",
w:[["interrupt","interrompere","unterbrechen"],["go back to","tornare a",""],["run out of time","finire il tempo",""],["park it","rimandare, accantonare",""],["realistic","realistico",""],["commit to","impegnarsi a",""],["align","allinearsi",""],["take a step back","fare un passo indietro",""]],
p:[["Sorry to interrupt, but I think we're missing something.","Scusate se interrompo, ma credo ci sfugga qualcosa."],["Can we go back to the previous point?","Possiamo tornare al punto precedente?"],["We're running out of time.","Stiamo finendo il tempo."],["Let's park that for now.","Accantoniamolo per ora."],["I don't think that's realistic.","Non credo sia realistico."],["I can't commit to that date.","Non posso impegnarmi per quella data."]],
gr:`<p>Interrompere in inglese richiede sempre un cuscinetto davanti:</p>
<p class="ex"><b>Sorry to jump in, but...</b><br><b>Can I add one thing here?</b><br><b>Just to build on that...</b></p>
<p>Per rimandare senza chiudere la porta: <b>Let's park it</b> / <b>Let's take that offline</b>.</p>
<div class="tip">Non serve avere ragione in fretta. Serve una frase pronta per prendere la parola: senza quella, resti in silenzio anche quando hai la risposta giusta.</div>`},

{id:47,ph:4,t:"Colloquio: le domande scomode",s:"debolezze, buchi, motivi",
w:[["weakness","punto debole","Schwäche"],["strength","punto di forza","Stärke"],["gap","periodo scoperto",""],["growth","crescita",""],["feedback","riscontro",""],["handle","gestire",""],["under pressure","sotto pressione",""],["delegate","delegare",""]],
p:[["My biggest strength is problem solving.","Il mio punto di forza è risolvere problemi."],["I sometimes take on too much.","A volte mi carico di troppo."],["I'm working on delegating more.","Sto lavorando a delegare di più."],["I'm leaving because I want to grow technically.","Vado via perché voglio crescere tecnicamente."],["I work well under pressure.","Lavoro bene sotto pressione."],["I take feedback seriously.","Prendo sul serio i riscontri."]],
gr:`<p>Schema per ogni domanda scomoda, in due tempi:</p>
<p class="ex">1. Ammetti qualcosa di vero e non fatale: <b>I sometimes take on too much.</b><br>
2. Mostra cosa fai: <b>I've started planning my week on Mondays and saying no earlier.</b></p>
<p>Mai criticare il datore precedente. Il motivo si gira sempre in positivo: non "non mi trovavo bene", ma <b>I want to work more on X</b>.</p>
<div class="tip">Prepara <b>una</b> debolezza e <b>due</b> punti di forza, scritti e ripetuti ad alta voce. Improvvisare qui è dove si perdono i colloqui.</div>`},

<p class="ex">1. <b>Thank you for your time today.</b><br>

<div class="tip">Quasi nessuno la manda. Mandarla ti fa ricordare, e ti dà una seconda occasione per far vedere che scrivi bene in inglese.</div>`}

/* ============================ MOTORE ============================ */
const store={
  mem:{}, ok:true,
  get(k){ try{const v=localStorage.getItem(k);return v==null?this.mem[k]:v}catch(e){this.ok=false;return this.mem[k]} },
  set(k,v){ this.mem[k]=v; try{localStorage.setItem(k,v)}catch(e){this.ok=false} }
};
const DEF={xp:0,streak:0,last:"",done:[],srs:{},seen:[],rate:.85,voice:"",theme:"dark",de:true,lock:true,pin:"",best:0,dlg:[],lvl:{},goal:40,sfx:true,dayLog:{}};
let S=Object.assign({},DEF);
try{ S=Object.assign({},DEF,JSON.parse(store.get("speakfirst")||"{}")) }catch(e){}
const save=()=>store.set("speakfirst",JSON.stringify(S));
if(!S.lvl) S.lvl={};
S.done.forEach(id=>{ if(!S.lvl[id]) S.lvl[id]=1 });
const lvlOf=id=>S.lvl[id]||0;
const MAXLVL=3;
const todayKey=()=>new Date().toISOString().slice(0,10);

function touchStreak(){
  const t=todayKey(); if(S.last===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.last===y)? S.streak+1 : 1;
  S.last=t; save();
}
function addXp(n){ S.xp+=n; const t=todayKey(); S.dayLog[t]=(S.dayLog[t]||0)+n; save(); paintTop(); }

/* ---------------- riscontro sonoro ---------------- */
let AC=null;
function beep(ok){
  if(S.sfx===false) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    const tone=(f,at,dur,vol)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+at);
      g.gain.linearRampToValueAtTime(vol||.16,t+at+.012);
      g.gain.exponentialRampToValueAtTime(.0008,t+at+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t+at); o.stop(t+at+dur+.03);
    };
    if(ok){ tone(659,0,.10); tone(988,.075,.15) } else { tone(196,0,.20,.12) }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?12:[24,34,24]) }catch(e){}
}

const TTS={
  voices:[], ready:false,
  init(){
    const load=()=>{ this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); this.ready=true; };
    load(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=load;
  },
  pick(){
    if(!this.voices.length) return null;
    if(S.voice){ const f=this.voices.find(v=>v.name===S.voice); if(f) return f; }
    return this.voices.find(v=>/en-GB/i.test(v.lang)) || this.voices.find(v=>/en-US/i.test(v.lang)) || this.voices[0];
  },
  say(text,opt){
    opt=opt||{};
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const v=this.pick(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-GB";
      u.rate=opt.rate||S.rate; u.pitch=1;
      if(opt.el) wave(opt.el,true,(text.length*70)/u.rate);
      u.onend=()=>{ if(opt.done) opt.done(); };
      speechSynthesis.speak(u);
    }catch(e){ toast("La voce non è disponibile su questo browser"); }
  }
};

const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","i've":"i have","you've":"you have","we've":"we have","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","that's":"that is","what's":"what is","let's":"let us","i'd":"i would","hasn't":"has not","haven't":"have not","there's":"there is","how's":"how is"};
function norm(s){
  s=(s||"").toLowerCase().replace(/[\u2019\u00b4`]/g,"'").trim().replace(/'/g,"");
  s=" "+s.replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()+" ";
  Object.keys(CONTR).forEach(k=>{ s=s.split(" "+k.replace(/'/g,"")+" ").join(" "+CONTR[k]+" "); });
  return s.replace(/\s+/g," ").trim();
}
function similarity(a,b){
  const A=norm(a).split(" ").filter(Boolean), B=norm(b).split(" ").filter(Boolean);
  if(!A.length||!B.length) return 0;
  const pool=[...B]; let hit=0;
  A.forEach(w=>{ const i=pool.indexOf(w); if(i>-1){hit++;pool.splice(i,1);} });
  return hit/Math.max(A.length,B.length);
}

/* ============================ ESERCIZI ============================ */
function distractors(pool,correct,field,n){
  const out=[]; const p=shuffle(pool).filter(x=>x[field]!==correct);
  for(const x of p){ if(out.length>=n) break; if(!out.includes(x[field])) out.push(x[field]) }
  return out;
}
function unitItems(u){
  const a=[];
  u.w.forEach((r,i)=>a.push({key:srsKey(u.id,"w",i),en:r[0],it:r[1],de:r[2]||"",type:"w"}));
  u.p.forEach((r,i)=>a.push({key:srsKey(u.id,"p",i),en:r[0],it:r[1],de:"",type:"p"}));
  return a;
}
function poolFor(u){
  let p=unitItems(u);
  const others=UNITS.filter(x=>x.id!==u.id);
  shuffle(others).slice(0,4).forEach(o=>{ p=p.concat(unitItems(o)) });
  return p;
}
function buildExercises(u,lvl){
  lvl=lvl||0;
  const items=unitItems(u), pool=poolFor(u), ex=[];
  const words=items.filter(i=>i.type==="w"), phr=items.filter(i=>i.type==="p");
  const mc=it=>({k:"mc",it,options:shuffle([it.en].concat(distractors(pool,it.en,"en",3)))});
  const li=it=>({k:"listen",it,options:shuffle([it.it].concat(distractors(pool,it.it,"it",3)))});
  if(lvl<=0){                       /* livello 1: riconoscere */
    shuffle(words).forEach((it,i)=>ex.push(i%2?li(it):mc(it)));
    shuffle(phr).forEach((it,i)=>ex.push(i%3===0?{k:"tiles",it}:(i%3===1?li(it):{k:"speak",it})));
    shuffle(phr).slice(0,2).forEach(it=>ex.push({k:"write",it}));
    shuffle(words).slice(0,2).forEach(it=>ex.push({k:"write",it}));
    shuffle(phr).slice(0,2).forEach(it=>ex.push({k:"dict",it}));
  } else if(lvl===1){               /* livello 2: produrre */
    shuffle(words).forEach((it,i)=>ex.push(i%2?{k:"write",it}:li(it)));
    shuffle(phr).forEach((it,i)=>ex.push(i%2?{k:"tiles",it}:{k:"dict",it}));
    shuffle(phr).slice(0,3).forEach(it=>ex.push({k:"speak",it}));
  } else {                          /* livello 3: senza rete */
    shuffle(words).forEach(it=>ex.push({k:"write",it}));
    shuffle(phr).forEach(it=>ex.push({k:"dict",it}));
    shuffle(phr).slice(0,4).forEach(it=>ex.push({k:"speak",it}));
  }
  return shuffle(ex);
}
function testOutExercises(u){
  const items=unitItems(u), pool=poolFor(u);
  return shuffle(items).slice(0,8).map(it=>
    it.type==="p" ? {k:"dict",it} : {k:"write",it});
}
function reviewExercises(list){
  const pool=allSeenItems().concat(unitItems(UNITS[0]));
  return shuffle(list).map(it=>{
    const roll=Math.random();
    if(roll<.3) return {k:"listen",it,options:shuffle([it.it].concat(distractors(pool,it.it,"it",3)))};
    if(roll<.6) return {k:"mc",it,options:shuffle([it.en].concat(distractors(pool,it.en,"en",3)))};
    if(roll<.72) return {k:"write",it};
    if(roll<.86) return {k:"dict",it};
    return {k:"speak",it};
  });
}

    const nx=el("button","btn primary block","Ripetuta ad alta voce →");
    nx.onclick=()=>{ i++; step() };
    app.appendChild(nx);
  };
  const grammarStep=()=>{
    app.innerHTML="";
    const c=el("div","card fade");
    c.appendChild(el("span","badge","grammatica in pillole"));
    c.appendChild(el("h2","hero-en",esc(u.s))); c.lastChild.style.cssText="font-size:24px;margin:10px 0 12px";
    c.appendChild(el("div","gram",u.gr));
    app.appendChild(c);
    const b=el("button","btn primary block","Vai agli esercizi");
    b.onclick=()=>startEx();
    app.appendChild(b);
  };
  const startEx=()=>runSession(buildExercises(u,lvl),{
    title:"Lezione "+u.id+" \u00b7 livello "+(lvl+1), back:"course",
    onEnd:pct=>{
      if(!S.done.includes(u.id)) S.done.push(u.id);
      unitItems(u).forEach(it=>{ if(!S.srs[it.key]) srsGrade(it.key,true) });
      if(pct>=70 && lvlOf(u.id)<=lvl) S.lvl[u.id]=Math.min(lvl+1,MAXLVL);
      addXp(20); save();
    }
  });
  if(lvl>0) startEx(); else step();
}
